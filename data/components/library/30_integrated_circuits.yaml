# Integrated circuits: analog, power management, logic, drivers, mixed-signal, memory, interface.
# Pin numbers follow the standard DIP / TO / SOT packages named in `physical.package`.
# Signal-pin max_voltage is omitted where the limit depends on the chosen supply (e.g. VCC+0.5 V):
# the validator then reports "not checkable" instead of assuming a number.

components:
  ic:opamp-mcp6001:
    name: MCP6001 Rail-to-Rail Op-Amp
    short_name: MCP6001
    aliases: [mcp6001, op-amp, opamp, operational amplifier, rail to rail opamp]
    category: INTEGRATED_CIRCUIT
    object_type: PHYSICAL
    family: opamp
    tags: [amplifier, analog, single supply, rail-to-rail, low voltage]
    description: Single 1 MHz rail-to-rail input/output op-amp for 1.8-6 V single supplies.
    pins:
      - {pin_id: VOUT, name: VOUT, direction: OUTPUT, number: "1"}
      - {pin_id: VSS, name: VSS, direction: GROUND, number: "2", max_voltage: 0.0}
      - {pin_id: VIN_P, name: "VIN+", direction: INPUT, number: "3"}
      - {pin_id: VIN_N, name: "VIN-", direction: INPUT, number: "4"}
      - {pin_id: VDD, name: VDD, direction: POWER, supply: sink, number: "5", max_voltage: 7.0}
    electrical_properties: {operating_voltage: 1.8V-6.0V, gain_bandwidth: 1MHz, supply_current_typical: 100uA}
    interfaces: [ANALOG]
    symbol: {name: opamp, pin_map: {VIN_P: "+", VIN_N: "-", VOUT: OUT, VDD: "V+", VSS: "V-"}, ref_prefix: U}
    physical: {package: SOT-23-5, mounting: SMD, breadboard_compatible: false}
    design_constraints:
      - {kind: decoupling_capacitor, pins: [VDD], value: 100nF, severity: INFO, note: Place 100 nF from VDD to VSS close to the pin.}
    curriculum_mapping: [opamp_basics, analog_fundamentals, sensor_interface]
    education:
      summary: Amplifies the difference between its inputs; with feedback it forms precise gain stages.
      how_it_works: Negative feedback forces V+ ≈ V-; the feedback network sets the gain.
      typical_uses: [Non-inverting/inverting amplifiers, buffers, active filters, sensor front-ends]
      common_mistakes: [Leaving an unused input floating, expecting gain beyond the gain-bandwidth product]

  ic:opamp-lm358:
    name: LM358 Dual Op-Amp
    short_name: LM358
    aliases: [lm358, dual op-amp, dual opamp]
    category: INTEGRATED_CIRCUIT
    object_type: PHYSICAL
    family: opamp
    tags: [amplifier, analog, single supply, dual]
    description: Dual general-purpose op-amp, 3-32 V single supply (input range includes ground).
    pins:
      - {pin_id: OUT1, name: OUT1, direction: OUTPUT, number: "1"}
      - {pin_id: IN1_N, name: "IN1-", direction: INPUT, number: "2"}
      - {pin_id: IN1_P, name: "IN1+", direction: INPUT, number: "3"}
      - {pin_id: GND, name: GND, direction: GROUND, number: "4", max_voltage: 0.0}
      - {pin_id: IN2_P, name: "IN2+", direction: INPUT, number: "5"}
      - {pin_id: IN2_N, name: "IN2-", direction: INPUT, number: "6"}
      - {pin_id: OUT2, name: OUT2, direction: OUTPUT, number: "7"}
      - {pin_id: VCC, name: VCC, direction: POWER, supply: sink, number: "8", max_voltage: 32.0}
    electrical_properties: {operating_voltage: 3V-32V, gain_bandwidth: 1MHz}
    interfaces: [ANALOG]
    symbol: {name: ic_box, ref_prefix: U}
    physical: {package: DIP-8, mounting: THT, breadboard_compatible: true, pin_pitch_mm: 2.54}
    curriculum_mapping: [opamp_basics, analog_fundamentals]
    education:
      summary: Classic low-cost dual op-amp; output does not swing to VCC.
      common_mistakes: [Expecting rail-to-rail output (it tops out ~1.5 V below VCC)]

  ic:comparator-lm393:
    name: LM393 Dual Comparator
    short_name: LM393
    aliases: [lm393, comparator, dual comparator]
    category: INTEGRATED_CIRCUIT
    object_type: PHYSICAL
    family: comparator
    tags: [comparator, threshold, analog to digital, open collector]
    description: Dual voltage comparator with open-collector outputs, 2-36 V supply.
    pins:
      - {pin_id: OUT1, name: OUT1, direction: OUTPUT, number: "1"}
      - {pin_id: IN1_N, name: "IN1-", direction: INPUT, number: "2"}
      - {pin_id: IN1_P, name: "IN1+", direction: INPUT, number: "3"}
      - {pin_id: GND, name: GND, direction: GROUND, number: "4", max_voltage: 0.0}
      - {pin_id: IN2_P, name: "IN2+", direction: INPUT, number: "5"}
      - {pin_id: IN2_N, name: "IN2-", direction: INPUT, number: "6"}
      - {pin_id: OUT2, name: OUT2, direction: OUTPUT, number: "7"}
      - {pin_id: VCC, name: VCC, direction: POWER, supply: sink, number: "8", max_voltage: 36.0}
    electrical_properties: {operating_voltage: 2V-36V, output_type: open-collector}
    interfaces: [ANALOG, DIGITAL]
    symbol: {name: ic_box, ref_prefix: U}
    physical: {package: DIP-8, mounting: THT, breadboard_compatible: true, pin_pitch_mm: 2.54}
    design_constraints:
      - {kind: pullup_required, pins: [OUT1, OUT2], value: 10k, severity: WARNING, note: Open-collector outputs need a pull-up resistor (on used outputs).}
    curriculum_mapping: [comparator_threshold, analog_fundamentals]
    education:
      summary: Outputs a logic level telling which input is higher.
      how_it_works: Open-collector output transistor pulls low when IN- > IN+; a pull-up provides the high level.
      typical_uses: [Light/dark detectors, threshold alarms, zero-cross detection]
      common_mistakes: [Forgetting the output pull-up, no hysteresis on slow or noisy inputs]

  ic:timer-ne555:
    name: NE555 Timer
    short_name: NE555
    aliases: [ne555, "555", 555 timer, timer]
    category: INTEGRATED_CIRCUIT
    object_type: PHYSICAL
    family: timer
    tags: [oscillator, astable, monostable, pwm, blinker]
    description: Classic bipolar timer, 4.5-16 V supply, output sinks/sources up to 200 mA.
    pins:
      - {pin_id: GND, name: GND, direction: GROUND, number: "1", max_voltage: 0.0}
      - {pin_id: TRIG, name: TRIG, direction: INPUT, number: "2"}
      - {pin_id: OUT, name: OUT, direction: OUTPUT, number: "3"}
      - {pin_id: RESET, name: RESET, direction: INPUT, number: "4"}
      - {pin_id: CTRL, name: CTRL, direction: PASSIVE, number: "5"}
      - {pin_id: THRES, name: THRES, direction: INPUT, number: "6"}
      - {pin_id: DISCH, name: DISCH, direction: PASSIVE, number: "7"}
      - {pin_id: VCC, name: VCC, direction: POWER, supply: sink, number: "8", max_voltage: 18.0}
    electrical_properties: {operating_voltage: 4.5V-16V, output_current_capability: 200mA}
    interfaces: [DIGITAL, PWM]
    symbol: {name: ic_box, ref_prefix: U,
             box_sides: {TRIG: left, THRES: left, DISCH: left, CTRL: left, RESET: right, OUT: right}}
    physical: {package: DIP-8, mounting: THT, breadboard_compatible: true, pin_pitch_mm: 2.54}
    design_constraints:
      - {kind: decoupling_capacitor, pins: [VCC], value: 100nF, severity: INFO, note: Decouple VCC; add 10 nF on CTRL if it is unused.}
    curriculum_mapping: [rc_timing, oscillators]
    education:
      summary: Builds oscillators and one-shot timers from a resistor-capacitor network.
      how_it_works: Two comparators at 1/3 and 2/3 VCC flip an internal latch as the timing capacitor charges and discharges.
      typical_uses: [LED blinkers, tone generators, PWM, debouncing]
      common_mistakes: [Leaving RESET floating (tie it to VCC)]

  ic:regulator-lm7805:
    name: LM7805 5 V Linear Regulator
    short_name: LM7805
    aliases: [lm7805, "7805", 5v regulator, linear regulator]
    category: POWER_MANAGEMENT
    object_type: PHYSICAL
    family: linear_regulator
    tags: [power supply, voltage regulator, 5v]
    description: Fixed 5 V positive regulator, up to 1.5 A, input 7-35 V (about 2 V dropout).
    pins:
      - {pin_id: VIN, name: VIN, direction: POWER, supply: sink, number: "1", max_voltage: 35.0}
      - {pin_id: GND, name: GND, direction: GROUND, number: "2", max_voltage: 0.0}
      - {pin_id: VOUT, name: VOUT, direction: POWER, supply: source, nominal_voltage: 5.0, number: "3", max_voltage: 5.2}
    electrical_properties: {input_voltage_range: 7V-35V, output_voltage: 5V, output_current_capability: 1.5A, dropout_voltage: 2V}
    roles: [POWER]
    symbol: {name: regulator, ref_prefix: U}
    physical: {package: TO-220, mounting: THT, breadboard_compatible: true, pin_pitch_mm: 2.54}
    design_constraints:
      - {kind: decoupling_capacitor, pins: [VIN], value: 330nF, severity: WARNING, note: Input capacitor (0.33 µF) is required when far from the supply filter.}
      - {kind: decoupling_capacitor, pins: [VOUT], value: 100nF, severity: INFO, note: Output capacitor (0.1 µF) improves transient response.}
    curriculum_mapping: [linear_regulation, power_conversion]
    education:
      summary: Drops a higher DC voltage to a steady 5 V.
      how_it_works: A pass transistor dissipates (Vin − 5 V)·I as heat to hold the output constant.
      typical_uses: [5 V rails from 9-12 V adapters or batteries]
      common_mistakes: ["Ignoring heat: 12 V to 5 V at 1 A dissipates 7 W and needs a heatsink"]

  ic:ldo-ams1117-3v3:
    name: AMS1117-3.3 LDO Regulator
    short_name: AMS1117-3.3
    aliases: [ams1117, ams1117-3.3, 3.3v regulator, ldo]
    category: POWER_MANAGEMENT
    object_type: PHYSICAL
    family: linear_regulator
    tags: [power supply, voltage regulator, 3.3v, ldo]
    description: 3.3 V 1 A low-dropout regulator (input up to 15 V, ~1.1 V dropout at 1 A).
    pins:
      - {pin_id: GND, name: GND, direction: GROUND, number: "1", max_voltage: 0.0}
      - {pin_id: VOUT, name: VOUT, direction: POWER, supply: source, nominal_voltage: 3.3, number: "2", max_voltage: 3.4}
      - {pin_id: VIN, name: VIN, direction: POWER, supply: sink, number: "3", max_voltage: 15.0}
    electrical_properties: {input_voltage_range: 4.5V-15V, output_voltage: 3.3V, output_current_capability: 1A}
    roles: [POWER]
    symbol: {name: regulator, ref_prefix: U}
    physical: {package: SOT-223, mounting: SMD, breadboard_compatible: false}
    design_constraints:
      - {kind: decoupling_capacitor, pins: [VOUT], value: 10uF, severity: WARNING, note: Needs an output capacitor (≥10 µF tantalum/electrolytic) for stability.}
    curriculum_mapping: [linear_regulation, power_conversion]
    education:
      summary: Produces 3.3 V from a 5 V (or higher) rail with low dropout.
      common_mistakes: [Omitting the output capacitor (it can oscillate)]

