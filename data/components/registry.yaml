      electrical_type: 3.3V_LOGIC
      max_voltage: 3.6
    - pin_id: GPIO27
      name: GPIO27
      direction: BIDIRECTIONAL
      electrical_type: 3.3V_LOGIC
      max_voltage: 3.6
    - pin_id: GPIO32
      name: GPIO32
      direction: BIDIRECTIONAL
      electrical_type: 3.3V_LOGIC
      max_voltage: 3.6
    - pin_id: GPIO33
      name: GPIO33
