      name: EN
      direction: INPUT
      max_voltage: 3.6
      description: active-high enable
    electrical_properties:
      operating_voltage: 3.3V
      input_voltage_max: 12V
      gpio_max_current: 40mA
      gpio_abs_max_voltage: 3.6V
      wifi: 802.11 b/g/n
      bluetooth: BLE 4.2
    configurable_parameters: {}
    curriculum_mapping: []
    competency_level: BEGINNER
    provenance: community
    license: unknown
    validation_status: proposed
    interfaces:
    - DIGITAL
    - ANALOG
    - I2C
    - SPI
    - UART
    - PWM
    roles:
    - LOGIC
    - POWER
    requires_driver: false
    family: mcu_board
    symbol:
      name: ic_box
      ref_prefix: U
    short_name: ESP32-DevKitC
    education:
      summary: Wi-Fi/Bluetooth microcontroller board with 3.3 V logic.
      common_mistakes:
      - Feeding 5 V signals into GPIO pins (3.6 V max)
      - Drawing more than 40 mA from a pin
  sensor:hc-sr04:
    name: HC-SR04 Ultrasonic Distance Sensor
    aliases:
    - hc-sr04
    - ultrasonic
    category: SENSOR
    object_type: PHYSICAL
    description: HC-SR04 Ultrasonic Distance Sensor. ECHO pin outputs 5V logic — requires level shifting
      when connecting to 3.3V microcontrollers.
    pins:
    - pin_id: VCC
      name: VCC
      direction: POWER
      electrical_type: 5V
      max_voltage: 5.0
      description: 5V power input
    - pin_id: TRIG
      name: TRIG
      direction: INPUT
      electrical_type: 5V_TOLERANT
      max_voltage: 5.0
      description: Trigger input. Accepts 3.3V logic high.
    - pin_id: ECHO
      name: ECHO
      direction: OUTPUT
      electrical_type: 5V
      max_voltage: 5.0
      min_voltage: 4.8
      description: Echo output. Outputs 5V pulse proportional to distance. REQUIRES level shifting for
        3.3V MCUs.
    - pin_id: GND
      name: GND
      direction: GROUND
      max_voltage: 0.0
    electrical_properties:
      operating_voltage: 5V
      measuring_range: 2cm-400cm
      trigger_pulse: 10us
      echo_output_voltage: 5V
    configurable_parameters: {}
    curriculum_mapping: []
    competency_level: BEGINNER
    provenance: community
    license: unknown
    validation_status: proposed
    interfaces:
    - DIGITAL
    roles:
    - SENSOR
    requires_driver: false
    recommended_control_interface: DIGITAL
    family: ultrasonic_sensor
    symbol:
      name: ic_box
      ref_prefix: U
    short_name: HC-SR04
    education:
      summary: Measures distance by timing an ultrasonic echo (2-400 cm).
      common_mistakes:
      - Connecting the 5 V ECHO output straight to a 3.3 V microcontroller
  passive:led-5mm:
    name: Generic 5mm LED
    aliases:
    - led
    - 5mm-led
    category: PASSIVE_COMPONENT
    object_type: PHYSICAL
    description: Generic 5mm through-hole LED
    pins:
    - pin_id: ANODE
      name: ANODE
      direction: PASSIVE
    - pin_id: CATHODE
      name: CATHODE
      direction: PASSIVE
    electrical_properties:
      forward_voltage_typical: 2.0V
      forward_voltage_max: 2.4V
      max_forward_current: 20mA
      recommended_current: 10mA
    configurable_parameters:
      color: enum
    curriculum_mapping: []
    competency_level: BEGINNER
    provenance: community
    license: unknown
    validation_status: proposed
    interfaces:
    - DIGITAL
    - PWM
    roles:
    - ACTUATOR
    - DISPLAY
    requires_driver: false
    recommended_control_interface: DIGITAL
    symbol:
      name: led
      pin_map:
        ANODE: A
        CATHODE: K
      ref_prefix: D
    family: led
    short_name: LED
    design_constraints:
    - kind: series_resistor
      pins:
      - ANODE
      - CATHODE
      severity: ERROR
      note: An LED needs a current-limiting resistor.
    education:
      summary: Emits light when current flows from anode to cathode.
      how_it_works: Forward-biased junction with ~2 V drop (red) to ~3 V (blue/white); brightness follows
        current.
      typical_uses:
      - Indicators
      - Status lights
      common_mistakes:
      - No series resistor
      - Reversed polarity (long leg is the anode)
  passive:resistor-tht:
    name: Generic Resistor THT
    aliases:
    - resistor
    category: PASSIVE_COMPONENT
    object_type: PHYSICAL
    description: Generic through-hole resistor
    pins:
    - pin_id: PIN1
      name: PIN1
      direction: PASSIVE
    - pin_id: PIN2
      name: PIN2
      direction: PASSIVE
    electrical_properties:
      power_rating: 0.25W
    configurable_parameters:
      resistance: ohm
    curriculum_mapping: []
    competency_level: BEGINNER
    provenance: community
    license: unknown
    validation_status: proposed
    interfaces: []
    roles:
    - POWER
    - LOGIC
    requires_driver: false
    symbol:
      name: resistor
      pin_map:
        PIN1: '1'
        PIN2: '2'
      ref_prefix: R
    family: resistor
    short_name: R
    education:
      summary: Limits current and divides voltage (V = I·R).
      typical_uses:
      - LED current limiting
      - Pull-up/pull-down
      - Voltage dividers
      - Transistor base drive
      common_mistakes:
      - Ignoring power rating (P = I²R)
