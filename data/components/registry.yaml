  "sensor:hc-sr04":
    name: "HC-SR04 Ultrasonic Distance Sensor"
    aliases: ["hc-sr04", "ultrasonic"]
    category: SENSOR
    object_type: PHYSICAL
    description: "HC-SR04 Ultrasonic Distance Sensor"
    pins:
      - pin_id: "VCC"
        name: "VCC"
        direction: POWER
        description: "5V input"
      - pin_id: "TRIG"
        name: "TRIG"
        direction: INPUT
        electrical_type: "5V_TOLERANT"
      - pin_id: "ECHO"
        name: "ECHO"
        direction: OUTPUT
        electrical_type: "5V"
        description: "outputs 5V, ESP32 GPIOs are 3.3V only, but many people connect directly - known concern"
      - pin_id: "GND"
        name: "GND"
        direction: GROUND
    electrical_properties:
      operating_voltage: "5V"
      measuring_range: "2cm-400cm"
      trigger_pulse: "10us"
    configurable_parameters: {}
    curriculum_mapping: []
    competency_level: BEGINNER
    provenance: "community"
    license: "unknown"
    validation_status: "proposed"

