     body_z: 0.0, visual: pushbutton, internal_links: [[PIN1A, PIN1B], [PIN2A, PIN2B]], source: typical,
     note: "6 x 6 mm tactile switch straddling the trench; the pins of each pair are connected inside the switch."}
  active:transistor-npn-2n2222:
    {package: TO-92, pin_order: [E, B, C], source: typical,
     variant_note: "PN2222A (TO-92) pinout E-B-C assumed; the metal-can 2N2222 and some TO-92 variants differ - check the datasheet of the part in hand."}
  semiconductor:pmos-bs250:
    {package: TO-92, pin_order: [S, G, D], source: assumed,
     variant_note: "Pin order not recorded in the library; shown in registry order - check the datasheet."}
  sensor:ds18b20:
