# Per-part physical definitions (breadboard / 3D projection).
#
# Used when a part needs more than its package template: parts without a `physical` block in the
# registry, pin orders that are not given by registry pin numbers, modules and boards, and
# off-board items. Anything not known stays out; a part with no entry and no usable package is
# shown as a clearly labelled fallback module ("assumed" geometry) and physical verification says so.
#
# Fields (in addition to those in packages.yaml)
#   package        package template to start from (packages.yaml key)
#   mount          breadboard | offboard (default: from the template)
#   pin_order      site order for inline / two_lead parts (default: registry pin numbers)
#   pin_numbers    physical pin numbers for dip / dual_row parts whose registry pins lack them
#   pin_alias      engineering pin -> the physical pin it shares (internally common pins)
#   internal_links groups of pins that are connected inside the part
#   body_offset_mm body centre relative to the first pin, in the unrotated footprint [x, y]
#   terminals      off-board: [{pin, style: lead|header|screw|pad, at: [x, y, z], color}] relative to
#                  the body centre (z measured from the table)
#   header         off-board shortcut: {pins: [...], pitch, y, z, x0} generates header terminals
#   variant_note   pinout/order that differs between vendors (reported as a physical warning)

parts:
  # ── two-lead parts ─────────────────────────────────────────────────────────
  passive:resistor-tht:
    {package: axial-0.25W, pin_order: [PIN1, PIN2]}
  passive:inductor:
    {package: axial-0.25W, pin_order: [PIN1, PIN2], visual: axial_inductor, source: typical,
     note: "Shown as a small axial (resistor-style) inductor; real inductors vary widely in shape."}
  passive:led-5mm:
    {template: two_lead, spans: [1, 2, 3], pin_order: [ANODE, CATHODE], body_mm: [5.8, 5.8, 8.6], body_z: 1.0,
     visual: led_5mm, source: standard,
     note: "5 mm (T-1 3/4) LED, 2.54 mm lead spacing; the anode is the longer lead, the cathode is at the flat on the rim."}
  passive:capacitor-ceramic:
    {template: two_lead, spans: [1, 2], pin_order: [PIN1, PIN2], body_mm: [4.0, 2.5, 5.0], body_z: 1.0,
     visual: ceramic_cap, source: typical,
     note: "Small radial ceramic capacitor; lead spacing 2.54 or 5.08 mm depending on the part."}
  passive:capacitor-electrolytic:
    {template: two_lead, spans: [1, 2], pin_order: [ANODE, CATHODE], body_mm: [5.0, 5.0, 11.0], body_z: 0.5,
     visual: electrolytic_cap, source: typical,
     note: "Small radial electrolytic (5 mm diameter); the stripe marks the negative lead."}
  passive:push-button-2pin:
    {package: 6mm tactile, pin_order: [PIN1, PIN2]}
  passive:switch-slide-spst:
    {template: two_lead, spans: [2, 1], pin_order: [PIN1, PIN2], body_mm: [8.6, 3.6, 4.0], body_z: 0.5,
     visual: slide_switch, source: typical,
     note: "Miniature slide switch; only the two contacts of the SPST function are modelled."}
  sensor:photoresistor:
    {template: two_lead, spans: [2, 1, 3], pin_order: [PIN1, PIN2], body_mm: [5.1, 2.0, 4.3], body_z: 2.0,
     visual: ldr, source: typical, note: "5 mm light-dependent resistor (GL55-style); flexible leads."}
  sensor:thermistor:
    {template: two_lead, spans: [2, 1, 3], pin_order: [PIN1, PIN2], body_mm: [5.0, 2.5, 5.0], body_z: 2.0,
     visual: thermistor_disc, source: typical, note: "Radial disc thermistor; flexible leads."}
  actuator:buzzer-piezo:
    {template: two_lead, spans: [3], pin_order: [VCC, GND], body_mm: [12.0, 12.0, 9.5], body_z: 0.5,
     visual: buzzer, source: typical,
     note: "12 mm active buzzer, lead spacing about 7.6 mm; + is the longer lead / marked on the top."}

  # ── inline parts ───────────────────────────────────────────────────────────
  passive:potentiometer:
