     variant_note: "GY-521 breakout header order VCC, GND, SCL, SDA, XDA, XCL, AD0, INT assumed."}
  actuator:oled-i2c:
    {template: inline, pin_order: [GND, VCC, SCL, SDA], body_mm: [27.3, 27.8, 3.7], body_z: 8.5,
     body_offset_mm: [3.81, -12.5], visual: oled, source: typical,
     variant_note: "0.96-inch I2C OLED header order GND, VCC, SCL, SDA assumed; many modules swap GND and VCC - check the silkscreen."}
  actuator:7-segment:
    {template: dual_row, row_span: 5, pin_numbers: {E: 1, D: 2, COM1: 3, C: 4, DP: 5, B: 6, A: 7, COM2: 8, F: 9, G: 10},
     body_mm: [12.6, 19.0, 8.0], body_z: 0.5, visual: seven_segment, source: typical,
     variant_note: "Common 0.56-inch single-digit pinout (pins 1-5 E D COM C DP, 6-10 B A COM F G) assumed; row spacing modelled as 5 grid steps."}
  logic:74hc595:
    {package: DIP-16, pin_numbers: {QB: 1, QC: 2, QD: 3, QE: 4, QF: 5, QG: 6, QH: 7, GND: 8, QH_PRIME: 9, SRCLR: 10,
                                    SRCLK: 11, RCLK: 12, OE: 13, SER: 14, QA: 15, VCC: 16}, source: datasheet,
     note: "74HC595 (DIP-16) standard pinout."}

